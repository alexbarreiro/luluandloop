<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lulu &amp; Loop — Pago seguro</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  body { margin:0; background:#FFF8F0; font-family:'Nunito Sans',system-ui,sans-serif; color:#2A2A33; }
  .top { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid #F0E2D8; }
  .word { font-weight:900; font-size:19px; } .word b { color:#E4657E; }
  .sub { font-size:12px; color:#6E6E7A; font-weight:700; }
  #mount { max-width:520px; margin:14px auto; padding:0 10px 30px; min-height:480px; }
  .err { text-align:center; color:#9A4B60; font-weight:700; padding:40px 20px; }
</style>
</head>
<body>
  <div class="top">
    <span class="word">Lulu <b>&amp;</b> Loop</span>
    <span class="sub" id="sub">🔒 Pago seguro · nunca sales de luluandloop.com</span>
  </div>
  <div id="mount"></div>
<script src="/js/config.js"></script>
<script src="https://js.stripe.com/v3/"></script>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.hash.slice(1));
  var cs = params.get('cs');
  var hl = params.get('hl') || localStorage.getItem('luluandloop.lang') || 'es';
  if (hl === 'en') {
    document.documentElement.lang = 'en';
    document.getElementById('sub').textContent = '🔒 Secure payment · you never leave luluandloop.com';
  }
  var mount = document.getElementById('mount');
  if (!cs || !window.LULU_CONFIG || !window.LULU_CONFIG.STRIPE_PK || !window.Stripe) {
    mount.innerHTML = '<div class="err">Este enlace de pago no es válido o ya expiró — pídele uno nuevo a Lulu 💗</div>';
    return;
  }
  // keep the secret out of history entries shared via copy/paste
  try { history.replaceState(null, '', '/pay/'); } catch (e) { /* ignore */ }
  var stripe = window.Stripe(window.LULU_CONFIG.STRIPE_PK);
  stripe.initEmbeddedCheckout({ clientSecret: cs })
    .then(function (checkout) { checkout.mount('#mount'); })
    .catch(function () {
      mount.innerHTML = '<div class="err">Este pago ya se completó o el enlace expiró. Si necesitas ayuda, escríbele a Lulu 💗</div>';
    });
})();
</script>
</body>
</html>
